<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 Painel dos Pais</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4f8; color: #1a1a2e; min-height: 100vh; }

.header { background: linear-gradient(135deg, #1a1a2e 0%, #003DA5 100%); color: white; padding: 20px 24px; }
.header h1 { font-size: 20px; font-weight: 800; }
.header-sub { font-size: 13px; opacity: 0.7; margin-top: 2px; }

.tabs { display: flex; gap: 0; background: #1a1a2e; padding: 0 24px; }
.tab {
  padding: 12px 28px; font-size: 15px; font-weight: 700; cursor: pointer;
  color: rgba(255,255,255,0.5); border-bottom: 3px solid transparent;
  transition: all 0.15s;
}
.tab.ativo { color: white; border-bottom-color: #F5A623; }

.container { max-width: 1100px; margin: 0 auto; padding: 24px 24px 48px; }

.stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-bottom: 24px; }
.stat-card { background: white; border-radius: 14px; padding: 20px 18px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); border-top: 4px solid; }
.stat-card.blue  { border-color: #003DA5; }
.stat-card.green { border-color: #27AE60; }
.stat-card.gold  { border-color: #F5A623; }
.stat-card.red   { border-color: #E74C3C; }
.stat-icon  { font-size: 26px; margin-bottom: 8px; }
.stat-num   { font-size: 34px; font-weight: 900; }
.stat-label { font-size: 11px; color: #6C757D; font-weight: 600; text-transform: uppercase; margin-top: 2px; }

.row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
.card-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.full-row { margin-bottom: 20px; }

.materia-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid #f0f0f0; }
.materia-row:last-child { border-bottom: none; }
.materia-nome { min-width: 130px; font-size: 13px; font-weight: 600; }
.progress-bar { flex: 1; height: 7px; background: #E9ECEF; border-radius: 99px; }
.progress-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #003DA5, #0052CC); }
.materia-count { min-width: 60px; text-align: right; font-size: 12px; color: #6C757D; }

.aula-item { padding: 11px 0; border-bottom: 1px solid #f0f0f0; }
.aula-item:last-child { border-bottom: none; }
.aula-item-header { display: flex; justify-content: space-between; margin-bottom: 3px; }
.aula-mat { font-size: 13px; font-weight: 700; color: #003DA5; }
.aula-data { font-size: 12px; color: #6C757D; }
.aula-cap { font-size: 12px; color: #6C757D; margin-bottom: 3px; }
.aula-resumo { font-size: 13px; color: #333; line-height: 1.4; }
.tag { display: inline-block; font-size: 10px; font-weight: 700; border-radius: 99px; padding: 2px 8px; margin-top: 4px; }
.tag-trim { background: #E9ECEF; color: #6C757D; }

.quiz-mat-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid #f0f0f0; }
.quiz-mat-row:last-child { border-bottom: none; }
.qm-nome { flex: 1; font-size: 13px; font-weight: 600; }
.qm-resps { font-size: 12px; color: #6C757D; min-width: 70px; }
.taxa-badge { min-width: 55px; text-align: center; padding: 3px 8px; border-radius: 99px; font-size: 12px; font-weight: 700; }
.taxa-alto  { background: rgba(39,174,96,0.1);  color: #27AE60; }
.taxa-medio { background: rgba(245,166,35,0.1); color: #F5A623; }
.taxa-baixo { background: rgba(231,76,60,0.1);  color: #E74C3C; }

.streak-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
.streak-day { aspect-ratio: 1; border-radius: 4px; background: #E9ECEF; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #6C757D; font-weight: 600; }
.streak-day.estudou { background: #003DA5; color: white; }
.streak-day.hoje { outline: 2px solid #F5A623; }

.alerta { background: rgba(231,76,60,0.08); border: 1.5px solid rgba(231,76,60,0.25); border-radius: 12px; padding: 13px 16px; margin-bottom: 12px; display: flex; align-items: flex-start; gap: 10px; }
.alerta-ok { background: rgba(39,174,96,0.08); border-color: rgba(39,174,96,0.25); }
.alerta-icon { font-size: 18px; flex-shrink: 0; }
.alerta-texto { font-size: 13px; line-height: 1.5; }
.alerta-titulo { font-weight: 700; margin-bottom: 2px; }

.notif-btn { background: #f0f4f8; border: 1.5px solid #ddd; border-radius: 10px; padding: 10px 12px; font-size: 13px; font-weight: 600; cursor: pointer; text-align: left; transition: background 0.15s; }
.notif-btn:hover { background: #e2e8f0; border-color: #003DA5; }

.spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid #E9ECEF; border-top-color: #003DA5; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 40px auto; display: block; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 768px) {
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .row { grid-template-columns: 1fr; }
  .tab { padding: 12px 18px; font-size: 14px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>📊 Painel de Supervisão</h1>
  <div class="header-sub">Colégio Vicentino São José — Foz do Iguaçu</div>
</div>

<div class="tabs">
  <div class="tab ativo" onclick="trocarAba('tiago')">🔵 Tiago</div>
  <div class="tab" onclick="trocarAba('henrique')">🔴 Henrique</div>
</div>

<div class="container" id="conteudo">
  <div style="text-align:center;padding:60px 0"><div class="spinner"></div></div>
</div>

<script>
let abaAtiva = 'tiago';

function trocarAba(usuario) {
  abaAtiva = usuario;
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('ativo', (i === 0 && usuario === 'tiago') || (i === 1 && usuario === 'henrique'));
  });
  carregarPainel(usuario);
}

async function carregarPainel(usuario) {
  document.getElementById('conteudo').innerHTML = '<div style="text-align:center;padding:60px 0"><div class="spinner"></div></div>';

  const [stats, aulasRes, difsRes, semanaRes] = await Promise.all([
    fetch(`/api/stats?usuario=${usuario}`).then(r => r.json()),
    fetch(`/api/aulas?usuario=${usuario}`).then(r => r.json()),
    fetch(`/api/dificuldades?usuario=${usuario}`).then(r => r.json()),
    fetch(`/api/quiz/semana?usuario=${usuario}`).then(r => r.json())
  ]);

  const nome = usuario === 'tiago' ? 'Tiago' : 'Henrique';
  const serie = usuario === 'tiago' ? '1º ano EM' : '6º ano EF';
  const hoje = new Date().toISOString().split('T')[0];
  const aulas = aulasRes.aulas || [];

  // Alertas
  const streak = stats.streak_atual;
  const temHoje = aulas.some(a => (a.data || '').startsWith(hoje));
  const alertas = [];
  if (stats.total_aulas === 0) {
    alertas.push({ ok: false, icon: '🚨', titulo: 'Sistema ainda não foi usado', texto: `${nome} ainda não registrou nenhuma aula.` });
  } else if (!temHoje && streak === 0) {
    alertas.push({ ok: false, icon: '⚠️', titulo: 'Nenhum registro hoje', texto: `${nome} não registrou aulas hoje. O streak foi interrompido.` });
  } else if (temHoje) {
    alertas.push({ ok: true, icon: '✅', titulo: `${nome} estudou hoje!`, texto: `Streak atual: ${streak} dia${streak !== 1 ? 's' : ''} consecutivo${streak !== 1 ? 's' : ''}.` });
  }
  if (stats.taxa_acerto > 0 && stats.taxa_acerto < 50) {
    alertas.push({ ok: false, icon: '📉', titulo: 'Taxa de acerto baixa', texto: `Taxa atual de ${stats.taxa_acerto}%. Vale revisar as matérias com mais erros.` });
  }

  // Calendário
  const agora = new Date();
  const diasNoMes = new Date(agora.getFullYear(), agora.getMonth() + 1, 0).getDate();
  const diasEstudados = new Set(aulas.map(a => (a.data || '').substring(0, 10)));
  const calendario = Array.from({length: diasNoMes}, (_, i) => {
    const d = i + 1;
    const ds = `${agora.getFullYear()}-${String(agora.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    return `<div class="streak-day ${diasEstudados.has(ds) ? 'estudou' : ''} ${ds === hoje ? 'hoje' : ''}" title="${d}/${agora.getMonth()+1}">${d}</div>`;
  }).join('');

  // Matérias
  const maxAulas = Math.max(...(stats.por_materia || []).map(m => m.total_aulas), 1);
  const materiasHTML = (stats.por_materia || []).length === 0
    ? '<div style="color:#999;font-size:13px">Nenhuma aula registrada.</div>'
    : stats.por_materia.map(m => `
        <div class="materia-row">
          <div class="materia-nome">${m.materia}</div>
          <div class="progress-bar"><div class="progress-fill" style="width:${Math.round(m.total_aulas/maxAulas*100)}%"></div></div>
          <div class="materia-count">${m.total_aulas} aula${m.total_aulas !== 1 ? 's' : ''}</div>
        </div>`).join('');

  // Quiz por matéria
  const quizHTML = (stats.desempenho_quiz || []).length === 0
    ? '<div style="color:#999;font-size:13px">Nenhum quiz respondido ainda.</div>'
    : stats.desempenho_quiz.map(d => {
        const taxa = d.respostas > 0 ? Math.round(d.corretas / d.respostas * 100) : 0;
        const cl = taxa >= 70 ? 'taxa-alto' : taxa >= 50 ? 'taxa-medio' : 'taxa-baixo';
        return `<div class="quiz-mat-row"><div class="qm-nome">${d.materia}</div><div class="qm-resps">${d.respostas} resp.</div><div class="taxa-badge ${cl}">${taxa}%</div></div>`;
      }).join('');

  // Últimas aulas
  const ultimasHTML = aulas.length === 0
    ? '<div style="color:#999;font-size:13px">Nenhuma aula registrada.</div>'
    : aulas.slice(0, 8).map(a => `
        <div class="aula-item">
          <div class="aula-item-header">
            <div class="aula-mat">${a.materia}</div>
            <div class="aula-data">${formatarData(a.data)}</div>
          </div>
          ${a.capitulo ? `<div class="aula-cap">📖 ${a.capitulo}</div>` : ''}
          <div class="aula-resumo">${(a.resumo || '').substring(0,150)}${(a.resumo||'').length > 150 ? '...' : ''}</div>
          <span class="tag tag-trim">${a.trimestre}</span>
        </div>`).join('');

  document.getElementById('conteudo').innerHTML = `
    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card blue"><div class="stat-icon">📖</div><div class="stat-num">${stats.total_aulas}</div><div class="stat-label">Aulas Registradas</div></div>
      <div class="stat-card green"><div class="stat-icon">✅</div><div class="stat-num">${stats.taxa_acerto}%</div><div class="stat-label">Taxa de Acerto</div></div>
      <div class="stat-card gold"><div class="stat-icon">🔥</div><div class="stat-num">${stats.streak_atual}</div><div class="stat-label">Dias Seguidos</div></div>
      <div class="stat-card red"><div class="stat-icon">❓</div><div class="stat-num">${stats.total_respostas}</div><div class="stat-label">Quiz Respondidos</div></div>
    </div>

    <!-- Alertas -->
    <div class="full-row">
      ${alertas.map(a => `
        <div class="alerta ${a.ok ? 'alerta-ok' : ''}">
          <div class="alerta-icon">${a.icon}</div>
          <div class="alerta-texto"><div class="alerta-titulo">${a.titulo}</div>${a.texto}</div>
        </div>`).join('')}
    </div>

    <!-- Mapa de Dificuldades -->
    <div class="full-row">
      <div class="card">
        <div class="card-title">📉 Mapa de Dificuldades</div>
        ${(() => {
          const difs = difsRes.dificuldades || [];
          if (difs.length === 0) return '<div style="color:#27AE60;font-size:13px;font-weight:600">✅ Nenhuma dificuldade registrada</div>';
          const porMateria = {};
          difs.forEach(d => {
            if (!porMateria[d.materia]) porMateria[d.materia] = [];
            porMateria[d.materia].push(d);
          });
          return Object.entries(porMateria).map(([mat, items]) => `
            <div style="margin-bottom:14px">
              <div style="font-weight:700;font-size:13px;margin-bottom:6px;color:#003DA5">${mat}</div>
              ${items.map(d => `
                <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:6px 0;border-bottom:1px solid #f0f0f0">
                  <span style="color:#444">${d.tema || 'Sem tema'}</span>
                  <span style="color:#E74C3C;font-weight:700">${d.total_erros} erro${d.total_erros !== 1 ? 's' : ''} / ${d.total_respondidas} resp.</span>
                </div>`).join('')}
            </div>`).join('');
        })()}
      </div>
    </div>

    <!-- Matérias + Quiz -->
    <div class="row">
      <div class="card"><div class="card-title">📚 Matérias Estudadas</div>${materiasHTML}</div>
      <div class="card"><div class="card-title">⚡ Desempenho no Quiz</div>${quizHTML}</div>
    </div>

    <!-- Revisão da Semana -->
    <div class="full-row">
      <div class="card">
        <div class="card-title">🔄 Revisão da Semana</div>
        ${(() => {
          const materias = semanaRes.materias || [];
          const total = materias.reduce((s, m) => s + m.total, 0);
          if (total === 0) return `<div class="alerta alerta-ok"><div class="alerta-icon">🏆</div><div class="alerta-texto"><div class="alerta-titulo">${nome} zerou todas as revisões!</div>Nenhuma questão pendente esta semana.</div></div>`;
          return materias.map(m => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f0f0f0;font-size:13px">
              <span style="font-weight:600">${m.materia}</span>
              <span style="color:#E74C3C;font-weight:700">${m.total} questão${m.total !== 1 ? 'ões' : ''} pendente${m.total !== 1 ? 's' : ''}</span>
            </div>`).join('');
        })()}
      </div>
    </div>

    <!-- Últimas aulas + Calendário -->
    <div class="row">
      <div class="card"><div class="card-title">🕐 Últimas Aulas</div>${ultimasHTML}</div>
      <div class="card">
        <div class="card-title">📅 Dias Estudados Este Mês</div>
        <div style="font-size:26px;font-weight:800;margin-bottom:10px">${stats.dias_estudados_mes} dias</div>
        <div class="streak-grid">${calendario}</div>
        <div style="margin-top:10px;font-size:11px;color:#6C757D;display:flex;gap:14px">
          <span>🟦 Estudou</span><span>⬜ Sem registro</span>
        </div>
      </div>
    </div>
  `;

  setTimeout(() => carregarPainel(abaAtiva), 300000);
}

function formatarData(dateStr) {
  if (!dateStr) return '';
  return new Date(dateStr + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' });
}

carregarPainel('tiago');
</script>
</body>
</html>
